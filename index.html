        if (navigator.share) {
          navigator.share({ title: document.title, url }).catch(() => {});
        } else {
          navigator.clipboard.writeText(url).then(() => {
            alert('링크가 복사되었습니다!');
          }).catch(() => { prompt('Copy:', url); });
        }
      }

    </script>
